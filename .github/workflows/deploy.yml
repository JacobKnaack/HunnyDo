name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid overlapping deploys stepping on each other
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        # with:
          # path: . # The root location of your Astro project inside the repository. (optional)
          # node-version: 24 # The specific version of Node that should be used to build your site. Defaults to 24. (optional)
          # package-manager: pnpm@latest # The Node package manager that should be used to install dependencies and build your site. Automatically detected based on your lockfile. (optional)
          # build-cmd: pnpm run build # The command to run to build your site. Runs the package build script/task by default. (optional)
        # env:
          # PUBLIC_POKEAPI: 'https://pokeapi.co/api/v2' # Use single quotation marks for the variable value. (optional)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Tells the HunnyDo API which versions of the Terms and Privacy Policy are live, so it can show users the
  # "our terms changed" banner and email them. The API records a version once and ignores a repeat, so this is safe to run
  # on every deploy; only a version bumped in src/legal.json notifies anyone. Skipped until HUNNYDO_API_URL is set as a
  # repository variable, so deploys work before the webhook is live. See "Legal documents" in the README.
  notify-legal:
    needs: deploy
    if: ${{ vars.HUNNYDO_API_URL != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Publish the legal document versions to the API
        run: node scripts/publish-legal.mjs
        env:
          HUNNYDO_API_URL: ${{ vars.HUNNYDO_API_URL }}
          LEGAL_DOCUMENTS_WEBHOOK_SECRET: ${{ secrets.LEGAL_DOCUMENTS_WEBHOOK_SECRET }}
